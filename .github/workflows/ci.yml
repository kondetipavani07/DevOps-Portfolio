name: Portfolio CI/CD

on:
  push:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check project files
        run: |
          test -f index.html
          test -f style.css
          test -f script.js
          test -f Dockerfile

      - name: Build Docker image
        run: docker build -t devops-portfolio .

      - name: Run Docker container
        run: |
          docker run -d -p 8080:80 --name portfolio devops-portfolio

      - name: Test website
        run: |
          sleep 5
          curl http://localhost:8080

      - name: Stop container
        run: docker stop portfolio